name: Build Android APK from HTML

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Project Files
      run: |
        mkdir -p my-app/app/src/main/assets
        mkdir -p my-app/app/src/main/res/mipmap-hdpi
        mkdir -p my-app/app/src/main/res/mipmap-mdpi
        mkdir -p my-app/app/src/main/res/mipmap-xhdpi
        mkdir -p my-app/app/src/main/res/mipmap-xxhdpi
        mkdir -p my-app/app/src/main/res/mipmap-xxxhdpi
        mkdir -p my-app/app/src/main/res/drawable
        mkdir -p my-app/app/src/main/java/com/example/foxpocket
        mkdir -p my-app/app/src/main/res/values

        cp index.html my-app/app/src/main/assets/index.html

        if [ -f icon.png ]; then
          cp icon.png my-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png my-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon.png my-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png my-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png my-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon.png my-app/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icon.png my-app/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp icon.png my-app/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icon.png my-app/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icon.png my-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
        fi

        cat << 'EOF' > my-app/app/src/main/res/drawable/splash_icon.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="288dp"
            android:height="288dp"
            android:viewportWidth="288"
            android:viewportHeight="288">
            <path
                android:fillColor="#080B14"
                android:pathData="M0,0 L288,0 L288,288 L0,288 Z"/>
        </vector>
        EOF

        cat << 'EOF' > my-app/app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.FoxPocket" parent="android:Theme.NoTitleBar.Fullscreen">
                <item name="android:windowNoTitle">true</item>
                <item name="android:windowFullscreen">true</item>
                <item name="android:windowContentOverlay">@null</item>
                <item name="android:windowBackground">@android:color/black</item>
            </style>

            <style name="Theme.App.Starting" parent="Theme.SplashScreen">
                <item name="windowSplashScreenBackground">#080B14</item>
                <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
                <item name="postSplashScreenTheme">@style/Theme.FoxPocket</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > my-app/app/src/main/java/com/example/foxpocket/MainActivity.java
        package com.example.foxpocket;

        import android.Manifest;
        import android.app.Activity;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.graphics.Color;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.view.View;
        import android.view.Window;
        import android.view.WindowManager;
        import android.webkit.JavascriptInterface;
        import android.webkit.ValueCallback;
        import android.webkit.WebChromeClient;
        import android.webkit.WebView;
        import android.webkit.WebSettings;
        import androidx.core.app.ActivityCompat;
        import androidx.core.app.NotificationCompat;
        import androidx.core.app.NotificationManagerCompat;
        import androidx.core.content.ContextCompat;
        import androidx.core.splashscreen.SplashScreen;

        public class MainActivity extends Activity {

            private static final String CHANNEL_ID = "foxpocket_channel";
            private static final int FILE_CHOOSER_REQUEST_CODE = 5173;
            private static final int NOTIF_PERMISSION_REQUEST_CODE = 8421;
            private ValueCallback<Uri[]> filePathCallback;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                SplashScreen.installSplashScreen(this);
                super.onCreate(savedInstanceState);

                requestWindowFeature(Window.FEATURE_NO_TITLE);
                getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                        WindowManager.LayoutParams.FLAG_FULLSCREEN);

                View decorView = getWindow().getDecorView();
                decorView.setSystemUiVisibility(
                    View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                    | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                );

                createNotificationChannel();
                requestNotificationPermission();

                WebView webView = new WebView(this);
                webView.setBackgroundColor(Color.parseColor("#080B14"));
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setLoadWithOverviewMode(true);
                webSettings.setUseWideViewPort(true);

                webView.addJavascriptInterface(new NotifyBridge(), "AndroidNotify");

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public boolean onShowFileChooser(WebView webViewParam, ValueCallback<Uri[]> callback, FileChooserParams fileChooserParams) {
                        if (filePathCallback != null) {
                            filePathCallback.onReceiveValue(null);
                        }
                        filePathCallback = callback;
                        Intent intent = fileChooserParams.createIntent();
                        intent.addCategory(Intent.CATEGORY_OPENABLE);
                        intent.setType("image/*");
                        try {
                            startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                        } catch (Exception e) {
                            filePathCallback = null;
                            return false;
                        }
                        return true;
                    }
                });

                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                    if (filePathCallback == null) {
                        super.onActivityResult(requestCode, resultCode, data);
                        return;
                    }
                    Uri[] results = null;
                    if (resultCode == Activity.RESULT_OK && data != null) {
                        Uri uri = data.getData();
                        if (uri != null) {
                            results = new Uri[]{uri};
                        }
                    }
                    filePathCallback.onReceiveValue(results);
                    filePathCallback = null;
                } else {
                    super.onActivityResult(requestCode, resultCode, data);
                }
            }

            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                            CHANNEL_ID, "FoxPocket", NotificationManager.IMPORTANCE_HIGH);
                    channel.setDescription("FoxPocket notifications");
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                }
            }

            private void requestNotificationPermission() {
                if (Build.VERSION.SDK_INT >= 33) {
                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                            != PackageManager.PERMISSION_GRANTED) {
                        ActivityCompat.requestPermissions(this,
                                new String[]{Manifest.permission.POST_NOTIFICATIONS},
                                NOTIF_PERMISSION_REQUEST_CODE);
                    }
                }
            }

            private class NotifyBridge {
                @JavascriptInterface
                public void notify(String title, String message) {
                    NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, CHANNEL_ID)
                            .setSmallIcon(R.mipmap.ic_launcher)
                            .setContentTitle(title)
                            .setContentText(message)
                            .setStyle(new NotificationCompat.BigTextStyle().bigText(message))
                            .setPriority(NotificationCompat.PRIORITY_HIGH)
                            .setAutoCancel(true);
                    try {
                        NotificationManagerCompat.from(MainActivity.this)
                                .notify((int) System.currentTimeMillis(), builder.build());
                    } catch (SecurityException ignored) {
                    }
                }
            }
        }
        EOF

        cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.foxpocket">

            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:label="FoxPocket"
                android:usesCleartextTraffic="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@style/Theme.App.Starting">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        echo "include(':app')" > my-app/settings.gradle
        echo "rootProject.name='FoxPocket'" >> my-app/settings.gradle

        cat << 'EOF' > my-app/gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > my-app/app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.example.foxpocket'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.foxpocket"
                minSdk 21
                targetSdk 30
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.core:core:1.12.0'
            implementation 'androidx.core:core-splashscreen:1.0.1'
        }
        EOF

        cat << 'EOF' > my-app/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.3.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        echo "sdk.dir=$ANDROID_HOME" > my-app/local.properties

    - name: Clean Build Cache
      run: |
        cd my-app
        gradle clean

    - name: Build APK Modern
      run: |
        cd my-app
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: my-app/app/build/outputs/apk/debug/app-debug.apk
